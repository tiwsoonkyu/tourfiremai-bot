name: Faimai Scraper (4x Daily)

on:
  schedule:
    - cron: "0 1,5,9,14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Scrape mode"
        required: false
        default: "faimai"
        type: choice
        options:
          - faimai
          - normal
          - all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape-faimai:
    name: Scrape /faimai
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Faimai scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'faimai' }}"
          echo "Running scraper --mode $MODE"
          python scraper.py --mode $MODE
